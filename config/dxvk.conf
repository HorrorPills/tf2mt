# tuned DXVK for normal play: async pipeline compile + state cache, tear-free presentation.
# MoltenVK has no MAILBOX, so tearFree = FIFO (vsync) with 3 images. Owner-verified smooth at 120 Hz with
# the winemac mouse patch (docs/mouse-input.md). Previous immediate-mode config: dxvk-immediate.conf
dxvk.enableAsync = True
dxvk.enableStateCache = True
d3d9.tearFree = True
